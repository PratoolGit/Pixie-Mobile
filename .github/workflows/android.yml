name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      NODE_VERSION: '20'
      JAVA_VERSION: '17'
      ANDROID_API_LEVEL: '35'
      ANDROID_BUILD_TOOLS_VERSION: '35.0.0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Validate repo structure
        shell: bash
        run: |
          set -euxo pipefail

          test -f package.json
          test -f scripts/build-www.js
          test -f scripts/fetch-vision.js

      - name: Install JS dependencies
        shell: bash
        run: |
          set -euxo pipefail

          npm install --no-audit --no-fund --ignore-scripts
          node scripts/fetch-vision.js

      - name: Build web bundle
        shell: bash
        run: |
          set -euxo pipefail
          node scripts/build-www.js

      - name: Ensure Android project exists
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -d android ]; then
            echo "Android project directory missing. Creating it with Capacitor..."
            npx cap add android
          fi

          if [ ! -f android/gradlew ]; then
            echo "Expected android/gradlew not found after Capacitor setup."
            exit 1
          fi

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          set -euxo pipefail

          if [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            echo "ANDROID_SDK_ROOT is not set."
            exit 1
          fi

          export PATH="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${ANDROID_SDK_ROOT}/platform-tools:${PATH}"
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"

          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "sdkmanager not found in PATH."
            ls -la "${ANDROID_SDK_ROOT}" || true
            ls -la "${ANDROID_SDK_ROOT}/cmdline-tools" || true
            exit 1
          fi

          yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses >/dev/null || true
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmdline-tools;latest"

      - name: Prepare Android project
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -d android ]; then
            echo "Android project directory is missing."
            exit 1
          fi

          if [ ! -f scripts/patch-android.js ]; then
            echo "scripts/patch-android.js is missing."
            exit 1
          fi

          if [ ! -d android/app/src/main/assets ]; then
            echo "Android app assets missing; syncing capacitor project..."
            npx cap add android
          fi

          node scripts/patch-android.js
          npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename output
        shell: bash
        run: |
          set -euxo pipefail

          APK_PATH="$(find android/app/build/outputs/apk/debug -name 'app-debug.apk' -type f | head -n 1)"
          if [ -z "${APK_PATH:-}" ]; then
            echo "Debug APK not found."
            find android -path '*build/outputs*' -maxdepth 6 -type f | sort || true
            exit 1
          fi

          cp "${APK_PATH}" Pixie-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pixie-apk
          path: Pixie-debug.apk

      - name: Attach to release (tags)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Pixie-debug.apk

      - name: Collect diagnostics on failure
        if: failure()
        shell: bash
        run: |
          echo "Workflow failed. Collecting diagnostic information..."
          echo "---- Java ----"
          java -version || true
          echo "---- Node ----"
          node -v || true
          echo "---- npm ----"
          npm -v || true
          echo "---- Android SDK ----"
          ls -la "${ANDROID_SDK_ROOT:-/opt/android-sdk}" || true
          find "${ANDROID_SDK_ROOT:-/opt/android-sdk}" -maxdepth 3 -type d 2>/dev/null | head -n 200 || true
