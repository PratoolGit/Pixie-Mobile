name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            cmdline-tools;latest
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Install Android SDK packages
        shell: bash
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          set -euxo pipefail

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "sdkmanager not found"
            ls -la "$ANDROID_SDK_ROOT" || true
            ls -la "$ANDROID_SDK_ROOT/cmdline-tools" || true
            exit 1
          fi

          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmdline-tools;latest"

      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts && node scripts/fetch-vision.js

      - name: Build web bundle
        run: node scripts/build-www.js

      - name: Add Android platform
        run: npx cap add android && node scripts/patch-android.js && npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Rename output
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Pixie-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Pixie-apk
          path: Pixie-debug.apk

      - name: Attach to release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Pixie-debug.apk
